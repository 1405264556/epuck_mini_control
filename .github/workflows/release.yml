name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: '6.8.3'

jobs:
  test-linux:
    name: 测试 (Linux, offscreen)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev libeigen3-dev libgl1-mesa-dev \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3 libegl1
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          arch: linux_gcc_64
          modules: qtserialport qtconnectivity qtcharts
          cache: true
      - name: 构建
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel
      - name: 运行测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/tests/epuck_tests

  build-windows:
    name: 打包 Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          arch: win64_mingw
          modules: qtserialport qtconnectivity qtcharts
          tools: tools_mingw1310 tools_ninja
          cache: true
      - name: 构建 Release
        shell: pwsh
        run: |
          $mingw = Join-Path $env:IQTA_TOOLS 'mingw1310_64\bin'
          $ninja = Join-Path $env:IQTA_TOOLS 'Ninja'
          $env:PATH = "$mingw;$ninja;" + $env:PATH
          cmake -S . -B build/mingw-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF `
            "-DCMAKE_C_COMPILER=$mingw\gcc.exe" "-DCMAKE_CXX_COMPILER=$mingw\g++.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build/mingw-release --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: 打包
        shell: pwsh
        run: |
          $mingw = Join-Path $env:IQTA_TOOLS 'mingw1310_64\bin'
          try {
            ./tools/package.ps1 -QtRoot $env:QT_ROOT_DIR -CompilerBin $mingw
          } catch {
            # Surfaced as an annotation so the cause is visible without opening the log.
            $where = $_.InvocationInfo.ScriptLineNumber
            Write-Output "::error title=package.ps1 line $where::$($_.Exception.Message -replace "`r?`n", ' ')"
            exit 1
          }
          Get-ChildItem release
      - name: 启动自检
        shell: pwsh
        run: |
          # The packaged folder must start on its own, without Qt or MinGW on PATH.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $exe = Resolve-Path 'release\epuck_mini_control\epuck_mini_control.exe'
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "程序启动后退出，退出码 $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
          $log = Join-Path $env:LOCALAPPDATA 'EPFL\e-puck Mini Control\epuck_mini_control.log'
          if (-not (Test-Path $log)) { Write-Error '未生成日志文件'; exit 1 }
          Get-Content $log -Tail 5
          if (-not (Select-String -Path $log -Pattern 'Application initialized' -Quiet)) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: epuck_mini_control-win64
          path: release/*-win64.zip
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: epuck_mini_control-win64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} 掉线重连、键盘驾驶与界面优化
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: dist/*.zip
